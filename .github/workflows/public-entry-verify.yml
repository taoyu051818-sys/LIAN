name: Public Entry Verify

on:
  workflow_dispatch:
    inputs:
      public_base_url:
        description: Public base URL to verify
        required: false
        default: https://lian.nat100.top
  push:
    branches:
      - main

concurrency:
  group: public-entry-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-entry:
    name: Verify live public entry
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      LIAN_PUBLIC_BASE_URL: ${{ inputs.public_base_url || 'https://lian.nat100.top' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public entry
        run: npm run verify:public
